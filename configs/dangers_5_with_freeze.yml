DATA:
  ROOT: '../data/movyon/dataset'
  TRAIN_FILE: '../data/movyon/train.txt'
  VAL_FILE: '../data/movyon/val.txt'
  DATASET: 'movyon'
  INPUT_SIZE: 224
  NUM_FRAMES: 32
  NUM_CLASSES: 5
  LABEL_LIST: 'labels/dangers_5.csv'

MODEL:
  ARCH: 'ViT-B/16'
  DROP_PATH_RATE: 0.0
  PRETRAINED: None
  RESUME: null
  FIX_TEXT: true

TRAIN:
  EPOCHS: 50
  WARMUP_EPOCHS: 1
  WEIGHT_DECAY: 0.05
  LR: 5e-5
  BATCH_SIZE: 4
  ACCUMULATION_STEPS: 2

TEST:
  NUM_CLIP: 1
  NUM_CROP: 1
  ONLY_TEST: false

TRAINER:
  ViFi_CLIP:
    USE: custom_freeze

OUTPUT: '.runs'
SAVE_FREQ: 1
PRINT_FREQ: 50
SEED: 42
