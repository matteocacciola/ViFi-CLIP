DATA:
  ROOT: ../data/dataset_v2
  TRAIN_FILE: ../data/dangers_5_v2/dangers_5_train.txt
  VAL_FILE: ../data/dangers_5_v2/dangers_5_val.txt
  DATASET: 'movyon'
  INPUT_SIZE: 224
  NUM_FRAMES: 32
  LABEL_LIST: labels/dangers_5.csv

MODEL:
  ARCH: 'ViT-B/16'
  DROP_PATH_RATE: 0.0
  PRETRAINED: None
  RESUME: null
  FIX_TEXT: true

TRAIN:
  EPOCHS: 15
  WARMUP_EPOCHS: 3
  LR: 5e-8
  DROPOUT_RATE: 0.8
  WEIGHT_DECAY: 0.001
  AMSGRAD: true
  CLIP_GRAD: 0.05
  BATCH_SIZE: 16
  ACCUMULATION_STEPS: 5
  BEST_METRIC: f1


OUTPUT: '.runs'
SAVE_FREQ: 25
SEED: 42
