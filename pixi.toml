[workspace]
authors = ["Matteo Zanella <matteo.zanella98@gmail.com>"]
channels = ["conda-forge"]
name = "ViFi-CLIP"
platforms = ["linux-64"]
version = "0.1.0"

[tasks.train]
args = [{ "arg" = "config", "default" = "../data/movyon/config_vificlip_with_freeze.yml" }]
cmd = "torchrun main_mlflow.py --local_rank=0 --config {{ config }}"

[system-requirements]
cuda = "12.0"

[dependencies]
cuda-version = ">=12.8,<13"
pytorch-gpu = ">=2.7,<3"
torchvision = ">=0.22.0"
ftfy = ">=6.3.1,<7"
mlflow = ">=3.1.2,<4"
mmcv = ">=2.2.0,<3"
mmengine = ">=0.10.7"
onnx = ">=1.18.0,<2"
onnxruntime = ">=1.22.0,<2"
onnxconverter-common = ">=1.15.0,<2"
pandas = ">=2.3.1,<3"
regex = ">=2024.11.6,<2025"
timm = ">=1.0.15,<2"
yacs = ">=0.1.8"
opencv = ">=4.12.0,<5"

[pypi-dependencies]
decord = ">=0.6.0"
onnxscript = ">=0.3.1, <0.4"

[feature.dev.dependencies]
ipykernel = ">=6.29.5,<7"
ipywidgets = ">=8.1.7,<9"

[environments]
dev = ["dev"]
