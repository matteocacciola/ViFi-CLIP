[workspace]
authors = ["Matteo Zanella <matteo.zanella98@gmail.com>"]
channels = ["conda-forge"]
name = "ViFi-CLIP"
platforms = ["linux-64"]
version = "0.1.0"

[tasks.train]
args = [{ "arg" = "config", "default" = "./configs/dangers_5_with_freeze.yml" }]
cmd = "torchrun --standalone --nproc-per-node='auto' main.py --mlflow --config {{ config }}"

[system-requirements]
cuda = "12.0"

[dependencies]
cuda-version = ">=12.9,<13"
pytorch = ">=2.8.0,<3"
torchvision = ">=0.22.0,<0.25"
ftfy = ">=6.3.1,<7"
mlflow = ">=3.5.1,<4"
onnx = ">=1.19.1,<2"
onnxruntime = ">=1.22.0,<2"
pandas = ">=2.3.3,<3"
regex = ">=2025.11.3,<2026"
timm = ">=1.0.22,<2"
yacs = ">=0.1.8,<0.2"
opencv = ">=4.12.0,<5"
torchcodec = ">=0.8.1,<0.9"
termcolor = ">=3.2.0,<4"
torchmetrics = ">=1.8.2,<2"

[pypi-dependencies]
decord = ">=0.6.0, <0.7"
onnxscript = ">=0.5.6, <0.6"
onnxconverter-common = ">=1.16.0, <2"

[feature.dev.dependencies]
ipykernel = ">=7.1.0,<8"
ipywidgets = ">=8.1.8,<9"

[environments]
dev = ["dev"]
